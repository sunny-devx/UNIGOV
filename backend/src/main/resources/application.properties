# UNIGOV Spring Boot Application Configuration

spring.application.name=unigov-backend
server.port=8080

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unigov}
spring.datasource.username=${DB_USER:unigov}
spring.datasource.password=${DB_PASSWORD:unigov_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.gov.sih.unigov=INFO
logging.level.org.springframework.web=INFO
