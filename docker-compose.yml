services:
  postgres:
    image: postgres:16-alpine
    container_name: unigov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unigov}
      POSTGRES_USER: ${POSTGRES_USER:-unigov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unigov_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unigov} -d ${POSTGRES_DB:-unigov}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: unigov_postgres_data
